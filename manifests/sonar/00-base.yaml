apiVersion: v1
kind: Namespace
metadata:
  name: sonar
---
apiVersion: v1
kind: Secret
metadata:
  name: sonar-db
  namespace: sonar
type: Opaque
stringData:
  password: ${SONAR_DB_PASS}
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: sonar-pg
spec:
  capacity:
    storage: 5Gi
  accessModes: ["ReadWriteOnce"]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: local-sonar-pg
  hostPath:
    path: /data/sonarqube/pg
    type: DirectoryOrCreate
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: sonar-data
spec:
  capacity:
    storage: 10Gi
  accessModes: ["ReadWriteOnce"]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: local-sonar-data
  hostPath:
    path: /data/sonarqube/data
    type: DirectoryOrCreate
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: sonar-plugins
spec:
  capacity:
    storage: 1Gi
  accessModes: ["ReadWriteOnce"]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: local-sonar-plugins
  hostPath:
    path: /data/sonarqube/plugins
    type: DirectoryOrCreate
