apiVersion: apps/v1
kind: Deployment
metadata:
  name: sonar-db
  namespace: sonar
  labels: {app: sonar-db}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app: sonar-db}}
  template:
    metadata: {labels: {app: sonar-db}}
    spec:
      containers:
        - name: postgres
          image: harbor.corp.local/library/postgres:16
          env:
            - {name: POSTGRES_DB, value: sonar}
            - {name: POSTGRES_USER, value: sonar}
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: sonar-db, key: password}}
            - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
          ports: [{containerPort: 5432}]
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: "1", memory: 1Gi}
          volumeMounts:
            - {name: pg, mountPath: /var/lib/postgresql/data}
      volumes:
        - name: pg
          persistentVolumeClaim: {claimName: sonar-pg}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: sonar-pg, namespace: sonar}
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: local-sonar-pg
  resources: {requests: {storage: 5Gi}}
---
apiVersion: v1
kind: Service
metadata: {name: sonar-db, namespace: sonar}
spec:
  selector: {app: sonar-db}
  ports: [{port: 5432, targetPort: 5432}]
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: sonar-data, namespace: sonar}
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: local-sonar-data
  resources: {requests: {storage: 10Gi}}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: sonar-plugins, namespace: sonar}
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: local-sonar-plugins
  resources: {requests: {storage: 1Gi}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sonarqube
  namespace: sonar
  labels: {app: sonarqube}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app: sonarqube}}
  template:
    metadata: {labels: {app: sonarqube}}
    spec:
      securityContext:
        runAsUser: 1000
        fsGroup: 1000
      initContainers:
        - name: chown
          image: harbor.corp.local/library/postgres:16
          command: ["sh","-c","chown -R 1000:1000 /opt/sonarqube/data /opt/sonarqube/extensions/plugins || true"]
          securityContext: {runAsUser: 0}
          volumeMounts:
            - {name: data, mountPath: /opt/sonarqube/data}
            - {name: plugins, mountPath: /opt/sonarqube/extensions/plugins}
      containers:
        - name: sonarqube
          image: harbor.corp.local/library/sonarqube:10.7-community
          ports: [{containerPort: 9000}]
          env:
            - {name: SONAR_JDBC_URL, value: "jdbc:postgresql://sonar-db:5432/sonar"}
            - {name: SONAR_JDBC_USERNAME, value: sonar}
            - name: SONAR_JDBC_PASSWORD
              valueFrom: {secretKeyRef: {name: sonar-db, key: password}}
            - {name: SONAR_ES_BOOTSTRAP_CHECKS_DISABLE, value: "true"}
            - {name: SONAR_WEB_JAVAOPTS, value: "-Xmx700m"}
            - {name: SONAR_CE_JAVAOPTS, value: "-Xmx700m"}
            - {name: SONAR_SEARCH_JAVAOPTS, value: "-Xms512m -Xmx512m"}
            - {name: SONAR_WEB_CONTEXT, value: "/"}
          resources:
            requests: {cpu: 300m, memory: 1Gi}
            limits: {cpu: "3", memory: 3Gi}
          volumeMounts:
            - {name: data, mountPath: /opt/sonarqube/data}
            - {name: plugins, mountPath: /opt/sonarqube/extensions/plugins}
          readinessProbe:
            httpGet: {path: /api/system/status, port: 9000}
            initialDelaySeconds: 60
            periodSeconds: 15
            failureThreshold: 20
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: sonar-data}
        - name: plugins
          persistentVolumeClaim: {claimName: sonar-plugins}
---
apiVersion: v1
kind: Service
metadata: {name: sonarqube, namespace: sonar}
spec:
  type: NodePort
  selector: {app: sonarqube}
  ports: [{port: 9000, targetPort: 9000, nodePort: 30091}]
