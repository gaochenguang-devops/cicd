apiVersion: apps/v1
kind: Deployment
metadata:
  name: artifactory-db
  namespace: artifactory
  labels: {app: artifactory-db}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app: artifactory-db}}
  template:
    metadata: {labels: {app: artifactory-db}}
    spec:
      containers:
        - name: postgres
          image: harbor.corp.local/library/postgres:16
          env:
            - {name: POSTGRES_DB, value: artifactory}
            - {name: POSTGRES_USER, value: artifactory}
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: artifactory-db, key: password}}
            - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
          ports: [{containerPort: 5432}]
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: "1", memory: 1Gi}
          volumeMounts:
            - {name: pg, mountPath: /var/lib/postgresql/data}
      volumes:
        - name: pg
          persistentVolumeClaim: {claimName: artifactory-pg}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: artifactory-pg, namespace: artifactory}
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: local-arti-pg
  resources: {requests: {storage: 5Gi}}
---
apiVersion: v1
kind: Service
metadata: {name: artifactory-db, namespace: artifactory}
spec:
  selector: {app: artifactory-db}
  ports: [{port: 5432, targetPort: 5432}]
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: artifactory-data, namespace: artifactory}
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: local-arti-data
  resources: {requests: {storage: 20Gi}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: artifactory
  namespace: artifactory
  labels: {app: artifactory}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app: artifactory}}
  template:
    metadata: {labels: {app: artifactory}}
    spec:
      securityContext:
        runAsUser: 1030
        fsGroup: 1030
      containers:
        - name: artifactory
          image: harbor.corp.local/library/artifactory-oss:7.104.7
          ports:
            - {containerPort: 8081}
            - {containerPort: 8082}
          env:
            - {name: JF_SHARED_DATABASE_TYPE, value: postgresql}
            - {name: JF_SHARED_DATABASE_DRIVER, value: org.postgresql.Driver}
            - {name: JF_SHARED_DATABASE_URL, value: "jdbc:postgresql://artifactory-db:5432/artifactory"}
            - {name: JF_SHARED_DATABASE_USERNAME, value: artifactory}
            - name: JF_SHARED_DATABASE_PASSWORD
              valueFrom: {secretKeyRef: {name: artifactory-db, key: password}}
            - {name: JF_SHARED_JVM_MAX_SIZE, value: "2g"}
            - {name: EXTRA_JAVA_OPTIONS, value: "-Xmx2g -Xms512m"}
          resources:
            requests: {cpu: 300m, memory: 1Gi}
            limits: {cpu: "3", memory: 4Gi}
          volumeMounts:
            - {name: data, mountPath: /var/opt/jfrog/artifactory}
          readinessProbe:
            httpGet: {path: /artifactory/api/system/ping, port: 8081}
            initialDelaySeconds: 120
            periodSeconds: 20
            failureThreshold: 30
          startupProbe:
            httpGet: {path: /artifactory/api/system/ping, port: 8081}
            periodSeconds: 20
            failureThreshold: 45
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: artifactory-data}
---
apiVersion: v1
kind: Service
metadata: {name: artifactory, namespace: artifactory}
spec:
  type: NodePort
  selector: {app: artifactory}
  ports:
    - {name: web, port: 8082, targetPort: 8082, nodePort: 30092}
