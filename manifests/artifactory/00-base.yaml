apiVersion: v1
kind: Namespace
metadata:
  name: artifactory
---
apiVersion: v1
kind: Secret
metadata:
  name: artifactory-db
  namespace: artifactory
type: Opaque
stringData:
  password: ${ARTIFACTORY_DB_PASS}
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: artifactory-pg
spec:
  capacity: {storage: 5Gi}
  accessModes: ["ReadWriteOnce"]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: local-arti-pg
  hostPath: {path: /data/artifactory/pg, type: DirectoryOrCreate}
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: artifactory-data
spec:
  capacity: {storage: 20Gi}
  accessModes: ["ReadWriteOnce"]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: local-arti-data
  hostPath: {path: /data/artifactory/data, type: DirectoryOrCreate}
