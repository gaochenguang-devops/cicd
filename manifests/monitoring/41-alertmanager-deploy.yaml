apiVersion: apps/v1
kind: Deployment
metadata:
  name: alertmanager
  namespace: monitoring
  labels: {app: alertmanager}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: {app: alertmanager}
  template:
    metadata:
      labels: {app: alertmanager}
      annotations:
        rollout-note: "改 CM 后 rollout restart"
    spec:
      containers:
        - name: alertmanager
          image: harbor.corp.local/library/alertmanager:v0.27.0
          imagePullPolicy: IfNotPresent
          args:
            - --config.file=/etc/alertmanager/alertmanager.yml
            - --storage.path=/alertmanager
            - --web.external-url=https://alertmanager.corp.local
            - --cluster.listen-address=
          ports:
            - {name: web, containerPort: 9093}
          readinessProbe:
            httpGet: {path: /-/ready, port: 9093}
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: 500m, memory: 512Mi}
          volumeMounts:
            - {name: config, mountPath: /etc/alertmanager, readOnly: true}
            - {name: data, mountPath: /alertmanager}
      volumes:
        - name: config
          configMap:
            name: alertmanager-config
        - name: data
          hostPath:
            path: /data/monitoring/alertmanager
            type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: alertmanager
  namespace: monitoring
  labels: {app: alertmanager}
spec:
  selector: {app: alertmanager}
  ports:
    - {name: web, port: 9093, targetPort: 9093}
