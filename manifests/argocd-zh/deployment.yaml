apiVersion: apps/v1
kind: Deployment
metadata:
  name: argocd-zh-proxy
  namespace: argocd
  labels:
    app: argocd-zh-proxy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: argocd-zh-proxy
  template:
    metadata:
      labels:
        app: argocd-zh-proxy
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 96Mi
          volumeMounts:
            - name: conf
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
            - name: conf
              mountPath: /usr/share/nginx/html/zh-cn.js
              subPath: zh-cn.js
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 15
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 30
      volumes:
        - name: conf
          configMap:
            name: argocd-zh-proxy
---
apiVersion: v1
kind: Service
metadata:
  name: argocd-zh-proxy
  namespace: argocd
spec:
  type: NodePort
  selector:
    app: argocd-zh-proxy
  ports:
    - name: http
      port: 80
      targetPort: 8080
      nodePort: 30082
