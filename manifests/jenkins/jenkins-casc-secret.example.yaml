# Secret：JCasC 敏感值的唯一来源（ConfigMap 里不再出现明文）
#
# 本文件是「模板」，仓库里不放真实口令；真正创建用下面的命令（在服务器执行），
# 值取自各系统控制台（Harbor robot secret / Sonar 用户令牌 / Keycloak client secret）。
#
# kubectl -n jenkins create secret generic jenkins-casc-secrets \
#   --from-literal=GITLAB_PAT='glpat-...' \
#   --from-literal=HARBOR_CI_PASS='<robot$apps+jenkins-ci 的 secret>' \
#   --from-literal=HARBOR_LIB_PASS='<robot$library+jenkins-lib-pull 的 secret>' \
#   --from-literal=SONAR_TOKEN='squ_...' \
#   --from-literal=ARTI_USER='admin' \
#   --from-literal=ARTI_PASS='<Artifactory 口令>' \
#   --from-literal=OIDC_CLIENT_SECRET='<Keycloak client jenkins 的 secret>' \
#   --from-literal=BREAKGLASS_PASS='<应急账号口令>' \
#   --dry-run=client -o yaml | kubectl apply -f -
#
# 改完必须 `kubectl -n jenkins rollout restart deploy/jenkins`：
# envFrom 注入的环境变量不会热更新，只有重启才会重新读 Secret。
apiVersion: v1
kind: Secret
metadata:
  name: jenkins-casc-secrets
  namespace: jenkins
type: Opaque
stringData:
  GITLAB_PAT: "<placeholder>"
  HARBOR_CI_PASS: "<placeholder>"
  HARBOR_LIB_PASS: "<placeholder>"
  SONAR_TOKEN: "<placeholder>"
  ARTI_USER: "admin"
  ARTI_PASS: "<placeholder>"
  OIDC_CLIENT_SECRET: "<placeholder>"
  BREAKGLASS_PASS: "<placeholder>"
